
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALMOMENT - Football Live</title>
<style>
:root {
  --bg:#080d18;
  --panel:#111a2b;
  --panel2:#19243a;
  --green:#28e58a;
  --muted:#8b9bb4;
  --white:#f4f7ff;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--white);
 font-family:Arial,sans-serif;
}
header{
 padding:23px 18px;
 background:linear-gradient(120deg,#102d2b,#10182b);
 border-bottom:1px solid #26364c;
 display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:25px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--green)}
.live-indicator{color:var(--green);font-size:12px}
main{max-width:950px;margin:auto;padding:20px 14px}
.hero{
 padding:25px 20px;border-radius:17px;
 background:linear-gradient(120deg,#123e34,#172b45);
 margin-bottom:22px;
}
.hero h1{margin:0 0 8px;font-size:27px}
.hero p{color:#c5d7d3;margin:0;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
button{
 border:0;border-radius:10px;padding:12px 17px;
 background:var(--panel2);color:white;font-weight:bold;
 cursor:pointer;
}
button.active,button:hover{background:var(--green);color:#06150e}
#refresh{background:var(--green);color:#06150e}
.section-title{font-size:18px;margin:23px 0 13px}
#message{color:var(--muted);font-size:13px;margin:12px 0}
.match{
 background:var(--panel);border:1px solid #25334b;
 padding:16px;border-radius:14px;margin-bottom:11px;
}
.league{
 color:var(--muted);font-size:12px;
 display:flex;justify-content:space-between;margin-bottom:15px;
}
.teams{
 display:grid;grid-template-columns:1fr 90px 1fr;
 align-items:center;text-align:center;gap:7px;
}
.team img{width:38px;height:38px;object-fit:contain}
.team-name{font-size:13px;font-weight:bold;margin-top:7px}
.score{font-size:23px;font-weight:900}
.status{font-size:11px;color:var(--green);margin-top:5px}
.time{font-size:12px;color:var(--muted)}
.country-tag{color:var(--green);font-size:10px}
.empty{text-align:center;padding:30px;color:var(--muted)}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
@media(max-width:450px){
 .team-name{font-size:11px}
 .teams{grid-template-columns:1fr 65px 1fr}
 .score{font-size:20px}
}
</style>
</head>
<body>

<header>
 <div class="logo">GOAL<span>MOMENT</span></div>
 <div class="live-indicator">● FOOTBALL LIVE</div>
</header>

<main>
 <div class="hero">
  <h1>Le football, en direct.</h1>
  <p>Les scores, les résultats et les prochains matchs du monde entier.</p>
 </div>

 <div class="actions">
  <button class="active" data-tab="all">Tous</button>
  <button data-tab="live">🔴 En direct</button>
  <button data-tab="upcoming">À venir</button>
  <button data-tab="finished">Résultats</button>
  <button id="refresh">↻ Actualiser</button>
 </div>

 <div id="message">Chargement des matchs...</div>
 <div id="matches"></div>
</main>

<footer>
 GOALMOMENT © 2026 · Tous les matchs au même endroit
</footer>

<script>
// ===================================
// CONFIGURATION API-FOOTBALL
// ===================================

// Colle ici ta NOUVELLE clé API
const API_KEY = “476348f9c3a95e987a1d1cc5d9956028";

const API_URL = "https://v3.football.api-sports.io";
const TIMEZONE = "Europe/Paris";

let allMatches = [];
let currentTab = "all";

// Pays associé aux langues du navigateur
const countryNames = {
 FR:"France", US:"USA", GB:"England", DE:"Germany",
 ES:"Spain", IT:"Italy", PT:"Portugal", BR:"Brazil",
 AR:"Argentina", NL:"Netherlands", BE:"Belgium",
 MA:"Morocco", DZ:"Algeria", TN:"Tunisia",
 TR:"Turkey", JP:"Japan", KR:"South-Korea",
 MX:"Mexico", CA:"Canada", SN:"Senegal",
 CI:"Ivory-Coast", CH:"Switzerland", AT:"Austria"
};

function getVisitorCountry(){
 const locale = navigator.language || "fr-FR";
 const code = locale.split("-")[1]?.toUpperCase();
 return countryNames[code] || null;
}

const visitorCountry = getVisitorCountry();

function localDate(date){
 const y = date.getFullYear();
 const m = String(date.getMonth()+1).padStart(2,"0");
 const d = String(date.getDate()).padStart(2,"0");
 return `${y}-${m}-${d}`;
}

async function apiRequest(endpoint){
 const response = await fetch(API_URL + endpoint,{
  method:"GET",
  headers:{"x-apisports-key":API_KEY}
 });
 if(!response.ok) throw new Error("Erreur API : "+response.status);
 const data = await response.json();
 if(data.errors && Object.keys(data.errors).length){
  throw new Error(JSON.stringify(data.errors));
 }
 return data.response || [];
}

async function loadMatches(){
 const message = document.getElementById("message");
 const container = document.getElementById("matches");

 if(API_KEY === "COLLE_TA_NOUVELLE_CLE_ICI"){
  message.textContent="Ajoute ta clé API dans le code pour commencer.";
  return;
 }

 message.textContent="Chargement des vrais matchs...";
 document.getElementById("refresh").disabled=true;

 try{
  const today = localDate(new Date());
  const future = new Date();
  future.setDate(future.getDate()+7);
  const endDate = localDate(future);

  // Deux requêtes pour limiter le quota gratuit
  const [upcoming, finished] = await Promise.all([
   apiRequest(`/fixtures?from=${today}&to=${endDate}&timezone=${TIMEZONE}`),
   apiRequest(`/fixtures?last=10&timezone=${TIMEZONE}`)
  ]);

  const combined = [...upcoming,...finished];
  const unique = new Map();

  combined.forEach(match=>{
   unique.set(match.fixture.id,match);
  });

  allMatches = Array.from(unique.values());

  message.textContent =
   allMatches.length+" matchs chargés · Pays prioritaire : "+
   (visitorCountry || "Non détecté");

  renderMatches();

 }catch(error){
  console.error(error);
  message.textContent="Impossible de charger les matchs : "+error.message;
 }finally{
  document.getElementById("refresh").disabled=false;
 }
}

function getCategory(match){
 const status=match.fixture.status.short;
 const live=["1H","2H","HT","ET","BT","P","LIVE"];
 const finished=["FT","AET","PEN"];
 if(live.includes(status))return "live";
 if(finished.includes(status))return "finished";
 return "upcoming";
}

function renderMatches(){
 const container=document.getElementById("matches");
 container.innerHTML="";

 let filtered=allMatches.filter(match=>{
  return currentTab==="all" || getCategory(match)===currentTab;
 });

 // Priorité au pays du visiteur
 filtered.sort((a,b)=>{
  const aPriority=visitorCountry &&
   a.league.country===visitorCountry ? 1:0;
  const bPriority=visitorCountry &&
   b.league.country===visitorCountry ? 1:0;
  if(aPriority!==bPriority)return bPriority-aPriority;
  return new Date(a.fixture.date)-new Date(b.fixture.date);
 });

 if(!filtered.length){
  container.innerHTML='<div class="empty">Aucun match dans cette catégorie pour le moment.</div>';
  return;
 }

 filtered.forEach(match=>{
  const home=match.teams.home;
  const away=match.teams.away;
  const status=match.fixture.status;
  const category=getCategory(match);

  const date=new Date(match.fixture.date);
  const time=date.toLocaleString("fr-FR",{
   timeZone:TIMEZONE,
   day:"2-digit",month:"2-digit",
   hour:"2-digit",minute:"2-digit"
  });

  const scores = category==="upcoming"
   ? "VS"
   : `${match.goals.home ?? 0} - ${match.goals.away ?? 0}`;

  const statusText=category==="live"
   ? `EN DIRECT · ${status.elapsed ?? ""}'`
   : category==="finished"
    ? "TERMINÉ"
    : time;

  const priority=visitorCountry &&
   match.league.country===visitorCountry;

  const card=document.createElement("div");
  card.className="match";

  card.innerHTML=`
   <div class="league">
    <span>${match.league.flag || "⚽"} ${match.league.country} · ${match.league.name}</span>
    <span class="country-tag">${priority?"★ TON PAYS":""}</span>
   </div>
   <div class="teams">
    <div class="team">
     <img src="${home.logo}" alt="">
     <div class="team-name"></div>
    </div>
    <div>
     <div class="score">${scores}</div>
     <div class="status">${statusText}</div>
    </div>
    <div class="team">
     <img src="${away.logo}" alt="">
     <div class="team-name"></div>
    </div>
   </div>`;

  card.querySelectorAll(".team-name")[0].textContent=home.name;
  card.querySelectorAll(".team-name")[1].textContent=away.name;

  container.appendChild(card);
 });
}

document.querySelectorAll("[data-tab]").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  currentTab=button.dataset.tab;
  renderMatches();
 });
});

document.getElementById("refresh").addEventListener("click",loadMatches);

loadMatches();

// Actualisation automatique toutes les 30 minutes
// pour préserver le quota gratuit.
setInterval(loadMatches,30*60*1000);
</script>
</body>
</html>
