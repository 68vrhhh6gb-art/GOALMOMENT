
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALMOMENT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e1b;color:white;font-family:Arial,sans-serif}
header{padding:25px 18px;background:#111a2e;border-bottom:1px solid #26334c}
.logo{font-size:27px;font-weight:900;color:#42e88b}
header p{color:#aab5c8;margin-bottom:0}
nav{display:flex;gap:9px;padding:15px;overflow:auto}
button{border:0;border-radius:9px;padding:12px 16px;background:#202c43;color:white;font-weight:bold}
button.active{background:#42e88b;color:#07130c}
main{padding:10px 15px}
h2{font-size:20px}
#matches{display:grid;gap:12px}
.match{background:#151f32;border:1px solid #283751;border-radius:13px;padding:16px}
.league{font-size:12px;color:#42e88b;margin-bottom:13px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team{width:38%;font-weight:bold}
.team:last-child{text-align:right}
.score{font-size:22px;font-weight:900;white-space:nowrap}
.status{color:#aab5c8;font-size:12px;margin-top:12px}
.live{color:#ff6262;font-weight:bold}
#message{color:#aab5c8;padding:20px 4px}
footer{text-align:center;color:#718099;padding:30px;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="logo">⚽ GOALMOMENT</div>
  <p>Les scores du football mondial</p>
</header>

<nav>
  <button class="active" onclick="changeTab('all',this)">🌍 Monde</button>
  <button onclick="changeTab('live',this)">🔴 En direct</button>
  <button onclick="changeTab('local',this)">📍 Mon pays</button>
</nav>

<main>
  <h2 id="heading">Tous les matchs</h2>
  <div id="message">Chargement des scores...</div>
  <div id="matches"></div>
</main>

<footer>GOALMOMENT • Football partout dans le monde</footer>

<script>
const leagues = [
  "eng.1","esp.1","fra.1","ger.1","ita.1",
  "usa.1","mex.1","bra.1","arg.1","jpn.1",
  "aus.1","kor.1","uefa.champions","uefa.europa",
  "fifa.world","ned.1","por.1","sco.1","tur.1"
];

const country = (navigator.language || "fr-FR").split("-").pop().toUpperCase();

const localLeagues = {
  FR:["fra.1"],
  US:["usa.1","mex.1"],
  JP:["jpn.1","kor.1"],
  KR:["kor.1","jpn.1"],
  BR:["bra.1"],
  AR:["arg.1"],
  GB:["eng.1","sco.1"],
  ES:["esp.1"],
  DE:["ger.1"],
  IT:["ita.1"],
  NL:["ned.1"],
  PT:["por.1"],
  AU:["aus.1"],
  MX:["mex.1"]
};

let matches = [];
let currentTab = "all";

async function loadScores(){
  const box = document.getElementById("matches");
  const message = document.getElementById("message");
  message.textContent = "Chargement des matchs...";

  try {
    const results = await Promise.all(
      leagues.map(async league => {
        const url =
          "https://site.api.espn.com/apis/site/v2/sports/soccer/"
          + league + "/scoreboard";
        const response = await fetch(url);
        if(!response.ok) return [];
        const data = await response.json();

        return (data.events || []).map(event => ({
          ...event,
          leagueName: data.leagues?.[0]?.name || league,
          leagueCode: league
        }));
      })
    );

    const unique = new Map();
    results.flat().forEach(match => unique.set(match.id,match));
    matches = [...unique.values()];

    matches.sort((a,b) => new Date(a.date)-new Date(b.date));
    showMatches();
  } catch(error) {
    message.textContent =
      "Impossible de charger les scores. Réessaie dans un instant.";
  }
}

function showMatches(){
  const box = document.getElementById("matches");
  const message = document.getElementById("message");
  const heading = document.getElementById("heading");

  let list = [...matches];

  if(currentTab === "live"){
    list = list.filter(m =>
      m.status?.type?.state === "in"
    );
    heading.textContent = "🔴 Matchs en direct";
  } else if(currentTab === "local"){
    const preferred = localLeagues[country] || ["fra.1"];
    list.sort((a,b) =>
      preferred.indexOf(b.leagueCode) -
      preferred.indexOf(a.leagueCode)
    );
    heading.textContent = "📍 Matchs de ton pays";
  } else {
    heading.textContent = "🌍 Football mondial";
  }

  box.innerHTML = "";

  if(list.length === 0){
    message.textContent = "Aucun match trouvé pour le moment.";
    return;
  }

  message.textContent = list.length + " matchs trouvés";

  list.forEach(match => {
    const competition = match.competitions?.[0];
    const teams = competition?.competitors || [];
    const home = teams.find(t => t.homeAway === "home");
    const away = teams.find(t => t.homeAway === "away");

    if(!home || !away) return;

    const state = match.status?.type?.state;
    const isLive = state === "in";
    const score = state === "pre"
      ? "VS"
      : (home.score ?? "0") + " - " + (away.score ?? "0");

    const date = new Date(match.date);
    const time = date.toLocaleString();

    const card = document.createElement("div");
    card.className = "match";
    card.innerHTML = `
      <div class="league">${match.leagueName}</div>
      <div class="teams">
        <div class="team">${home.team.displayName}</div>
        <div class="score">${score}</div>
        <div class="team">${away.team.displayName}</div>
      </div>
      <div class="status ${isLive ? "live" : ""}">
        ${isLive ? "🔴 EN DIRECT" :
          match.status?.type?.shortDetail || time}
      </div>
    `;
    box.appendChild(card);
  });
}

function changeTab(tab,button){
  currentTab = tab;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.remove("active")
  );
  button.classList.add("active");
  showMatches();
}

loadScores();
setInterval(loadScores,60000);
</script>
</body>
</html>
